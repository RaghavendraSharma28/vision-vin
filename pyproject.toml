[project]
name = "mulkiya-vin"
version = "0.1.0"
description = "Hybrid UAE Mulkiya VIN extraction, validation, correction, and lookup pipeline."
requires-python = ">=3.10"
dependencies = [
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7", "paddleocr>=2.7", "paddlepaddle>=2.6"]
vlm = ["transformers>=4.45", "accelerate>=0.30", "torch>=2.2", "pillow>=10.0", "qwen-vl-utils>=0.0.8"]
db = ["pandas>=2.0", "openpyxl>=3.1"]
image = ["opencv-python>=4.8"]
dev = ["pytest>=8.0"]

[project.scripts]
mulkiya-vin = "mulkiya_vin.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
